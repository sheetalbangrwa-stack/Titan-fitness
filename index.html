<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Website Template</title>
<meta name="description" content="Premium gym website template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ============================================================================
  REUSABLE GYM WEBSITE TEMPLATE
  ============================================================================
  Every piece of gym-specific content on this page (text, images, prices,
  contact info, social links, colors) is rendered at runtime by script.js
  from the single source of truth in config.js.

  To rebrand this site for a client: edit config.js only.
  Do not edit the structure below unless you are changing the layout itself.
  ============================================================================
-->

<!-- ===== SCROLL PROGRESS ===== -->
<div class="scroll-progress" id="scrollProgress"></div>

<!-- ===== NAVIGATION ===== -->
<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="#home" class="nav-logo" id="navLogoMount"></a>

    <nav class="nav-links" id="navLinks"></nav>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== HERO ===== -->
<section class="hero" id="home">
  <div class="hero-bg">
    <div class="hero-img" id="heroImg"></div>
    <div class="hero-overlay"></div>
    <div class="spark-field" id="sparkField"></div>
  </div>

  <div class="hero-content reveal" id="heroContentMount"></div>

  <div class="hero-stats reveal" id="heroStatsMount"></div>

  <a href="#about" class="scroll-cue" aria-label="Scroll down"><span></span></a>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== ABOUT ===== -->
<section class="about" id="about">
  <div class="container about-grid">
    <div class="about-media reveal" id="aboutMediaMount"></div>
    <div class="about-copy reveal" id="aboutCopyMount"></div>
  </div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== SERVICES ===== -->
<section class="services" id="services">
  <div class="container">
    <p class="section-tag center" id="servicesTag"></p>
    <h2 class="section-title center" id="servicesTitle"></h2>
    <p class="section-text center lead" id="servicesSubtitle"></p>

    <div class="services-grid" id="servicesGrid"></div>
  </div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== MEMBERSHIP ===== -->
<section class="membership" id="membership">
  <div class="container">
    <p class="section-tag center" id="membershipTag"></p>
    <h2 class="section-title center" id="membershipTitle"></h2>
    <p class="section-text center lead" id="membershipSubtitle"></p>

    <div class="pricing-grid" id="pricingGrid"></div>
  </div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== TRAINERS ===== -->
<section class="trainers" id="trainers">
  <div class="container">
    <p class="section-tag center" id="trainersTag"></p>
    <h2 class="section-title center" id="trainersTitle"></h2>
    <p class="section-text center lead" id="trainersSubtitle"></p>

    <div class="trainers-grid" id="trainersGrid"></div>
  </div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== GALLERY ===== -->
<section class="gallery" id="gallery">
  <div class="container">
    <p class="section-tag center" id="galleryTag"></p>
    <h2 class="section-title center" id="galleryTitle"></h2>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== TESTIMONIALS ===== -->
<section class="testimonials" id="testimonials">
  <div class="container">
    <p class="section-tag center" id="testimonialsTag"></p>
    <h2 class="section-title center" id="testimonialsTitle"></h2>

    <div class="testi-slider reveal">
      <div class="testi-track" id="testiTrack"></div>
      <div class="testi-controls">
        <button id="testiPrev" aria-label="Previous testimonial">←</button>
        <div class="testi-dots" id="testiDots"></div>
        <button id="testiNext" aria-label="Next testimonial">→</button>
      </div>
    </div>
  </div>
</section>

<div class="seam" aria-hidden="true"></div>

<!-- ===== CONTACT ===== -->
<section class="contact" id="contact">
  <div class="container contact-grid">
    <div class="contact-info reveal" id="contactInfoMount"></div>

    <div class="contact-form-wrap reveal">
      <form class="contact-form" id="contactForm">
        <div class="form-row">
          <div class="form-field">
            <label for="fname">Name</label>
            <input type="text" id="fname" name="name" placeholder="Your name" required>
          </div>
          <div class="form-field">
            <label for="femail">Email</label>
            <input type="email" id="femail" name="email" placeholder="you@email.com" required>
          </div>
        </div>
        <div class="form-field">
          <label for="fmsg">Message</label>
          <textarea id="fmsg" name="message" rows="4" placeholder="Tell us your goals..." required></textarea>
        </div>
        <button type="submit" class="btn btn-accent btn-block">Send Message</button>
        <p class="form-note" id="formNote"></p>
      </form>

      <div class="map-embed" id="mapEmbedMount"></div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container footer-grid">
    <div class="footer-brand" id="footerBrandMount"></div>

    <div class="footer-col" id="footerNavMount"></div>

    <div class="footer-col" id="footerServicesMount"></div>

    <div class="footer-col" id="footerHoursMount"></div>
  </div>

  <div class="footer-bottom">
    <p>&copy; <span id="year"></span> <span id="footerGymName"></span>. All rights reserved.</p>
    <p class="footer-signature">Website template by you.</p>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>
<a class="whatsapp-float" id="whatsappFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.02 2.67C8.65 2.67 2.67 8.65 2.67 16.02c0 2.5.67 4.85 1.9 6.9L2.67 29.3l6.55-1.83a13.28 13.28 0 0 0 6.8 1.86h.01c7.37 0 13.35-5.98 13.35-13.35 0-3.56-1.39-6.92-3.9-9.43a13.26 13.26 0 0 0-9.46-3.9zm0 24.4h-.01a11.1 11.1 0 0 1-5.66-1.55l-.4-.24-4.02 1.12 1.1-3.94-.26-.4a11.02 11.02 0 0 1-1.7-5.94c0-6.12 4.98-11.1 11.1-11.1a11.03 11.03 0 0 1 11.06 11.1c0 6.12-4.98 11.1-11.1 11.1zm6.1-8.32c-.33-.17-1.97-.97-2.28-1.08-.31-.11-.53-.17-.76.17-.22.33-.87 1.08-1.07 1.31-.2.22-.39.25-.72.08-.33-.17-1.4-.51-2.67-1.65a10 10 0 0 1-1.84-2.29c-.19-.33-.02-.51.15-.68.15-.15.33-.39.5-.58.16-.2.22-.33.33-.55.11-.22.06-.42-.03-.58-.08-.17-.76-1.83-1.04-2.5-.27-.66-.55-.57-.76-.58h-.65c-.22 0-.58.08-.89.42-.3.33-1.17 1.14-1.17 2.79 0 1.64 1.2 3.23 1.37 3.45.17.22 2.36 3.6 5.72 5.05.8.35 1.42.55 1.9.7.8.26 1.53.22 2.11.13.64-.1 1.97-.8 2.25-1.58.28-.77.28-1.44.2-1.58-.08-.14-.3-.22-.63-.38z"/></svg>
</a>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
